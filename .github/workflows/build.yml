name: Build

# A news feed, so every run rebuilds -- there is no once-a-day guard here.
# "RSS Feeds Refresh" (refresh-script/) starts this hourly through the API,
# because GitHub runs this account's cron hours late; the cron is the backup.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:          # the Run workflow button, any time

permissions:
  contents: write             # the job commits the rebuilt page

concurrency:
  group: build
  cancel-in-progress: false   # never let two builds race to push

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # build.py uses the standard library only -- nothing to install.
      - name: Build the page
        run: python build.py

      - name: Commit and push
        run: |
          git config user.name "rss-feeds bot"
          git config user.email "actions@github.com"
          git add docs cache
          if git diff --cached --quiet; then
            echo "nothing new in the feed"
            exit 0
          fi
          git commit -m "Build $(TZ=America/New_York date '+%Y-%m-%d %H:%M %Z')"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
