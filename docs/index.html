<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>RSS Feeds</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" id="favicon">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-title" content="RSS Feeds">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0d1013">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Roboto+Slab:wght@500;700&display=swap">
<style>
/* Layout: a tab per team; under it one dated spine down the page, games as weighted bands on it, and the beat writing in the gaps between them.
   Type follows The Athletic's three voices with free stand-ins for its licensed fonts: Libre Franklin for
   nyt-franklin (labels, dates, scores), Source Serif 4 for nyt-cheltenham (headlines, teasers), Roboto Slab
   for its RegularSlab (team tabs, section heads). Dark only, by Kyle's choice. */
:root{
  --ice:#0d1013; --card:#15191e; --band:#171c22;
  --ink:#eceff3; --muted:#8e99a6; --line:#262d35; --line-soft:#1e242b;
  --accent:#ff3047; --accent-text:#ff3047; --accent-ink:#ff5d6e; --accent-wash:#221316; --on-accent:#fff;
  --loss:#6f7a87;
  --ff-head:"Source Serif 4",Georgia,"Times New Roman",serif;
  --ff-ui:"Libre Franklin","Helvetica Neue",Helvetica,Arial,sans-serif;
  --ff-slab:"Roboto Slab",Rockwell,Georgia,serif;
  color-scheme:dark;
}
/* each tab wears its team's colour; the Red Wings' red is the default above.
   --accent fills, --accent-text is the same hue light enough to read as text,
   --on-accent is the text on a filled pill. */
[data-team="mfootball"],[data-team="mbasketball"]{--accent:#ffcb05; --accent-text:#ffd437; --accent-ink:#ffe073; --accent-wash:#221d06; --on-accent:#00274c;}
[data-team="redwings"]{--accent:#ff3047; --accent-text:#ff3047; --accent-ink:#ff5d6e; --accent-wash:#221316; --on-accent:#fff;}
[data-team="tigers"]{--accent:#ff6a2b; --accent-text:#ff7f45; --accent-ink:#ff9a66; --accent-wash:#26170f; --on-accent:#15181d;}
[data-team="lions"]{--accent:#3aa0e0; --accent-text:#4fb0ee; --accent-ink:#74c2f2; --accent-wash:#0f1d28; --on-accent:#0d1013;}
[data-team="pistons"]{--accent:#19c0cb; --accent-text:#2fd0da; --accent-ink:#5fdde5; --accent-wash:#0c2224; --on-accent:#0d1013;}
[data-team="cavaliers"]{--accent:#fdbb30; --accent-text:#fdc54d; --accent-ink:#fdd27a; --accent-wash:#261e0c; --on-accent:#15181d;}
[data-team="tottenham"]{--accent:#8fa3ec; --accent-text:#a3b4f0; --accent-ink:#bcc8f5; --accent-wash:#141a2e; --on-accent:#0d1013;}
[data-team="soccer"]{--accent:#e2364b; --accent-text:#ef5266; --accent-ink:#f47a8a; --accent-wash:#271216; --on-accent:#fff;}
[data-team="rankings"],[data-team="home"]{--accent:#b6c0cc; --accent-text:#c3ccd6; --accent-ink:#d5dce4; --accent-wash:#1a1e23; --on-accent:#15181d;}
*{box-sizing:border-box}
body{background:var(--ice);color:var(--ink);font-family:var(--ff-ui);font-size:15px;line-height:1.45;margin:0;padding:0 16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding-block:0 64px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:2px}
.lbl{font-family:var(--ff-ui);font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* team page header: a Home button and the team's name; the home page lists every team */
header.top{position:sticky;top:0;z-index:6;background:var(--ice);border-bottom:2px solid var(--ink);
  padding:max(12px, env(safe-area-inset-top)) 0 10px;display:flex;align-items:center;gap:14px}
header.top[hidden]{display:none}
.home-btn{appearance:none;cursor:pointer;background:var(--card);border:1px solid var(--line);border-radius:3px;
  font-family:var(--ff-ui);font-weight:700;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--ink);padding:7px 11px 7px 9px}
.home-btn:hover{border-color:var(--accent)}
h1.team{font-family:var(--ff-slab);font-weight:700;font-size:22px;line-height:1.1;margin:0;border-bottom:3px solid var(--accent);padding-bottom:2px}
h1.team span{font-family:var(--ff-ui);font-size:15px;font-weight:600;color:var(--accent-ink);font-variant-numeric:tabular-nums}

#home[hidden],#body[hidden]{display:none}
.home-title{font-family:var(--ff-slab);font-weight:700;font-size:28px;margin:0;padding:max(22px, env(safe-area-inset-top)) 0 14px;border-bottom:2px solid var(--ink)}
.teams{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.team-row{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);
  border-left:4px solid var(--accent);border-radius:3px;padding:15px 16px}
.team-row:hover{border-color:var(--accent)}
.team-row .name{font-family:var(--ff-slab);font-weight:700;font-size:20px}
.team-row .count{font-family:var(--ff-ui);font-weight:700;font-size:15px;color:var(--accent-ink);font-variant-numeric:tabular-nums}
.team-row .done{font-family:var(--ff-ui);font-weight:600;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

.standing[hidden]{display:none}
.standing{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;margin-top:18px}
.rec{display:flex;align-items:baseline;gap:8px}
.rec b{font-family:var(--ff-slab);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums}

/* up next */
.next{margin-top:22px;border:1px solid var(--line);border-top:3px solid var(--accent);border-radius:3px;background:var(--card);padding:16px 18px}
.next:empty{display:none}
.next h2{font-family:var(--ff-slab);font-weight:700;font-size:23px;line-height:1.15;margin:7px 0 4px}
.next h2 i{font-family:var(--ff-ui);font-style:normal;color:var(--muted);font-weight:500;font-size:15px}
.next .when{font-family:var(--ff-ui);font-size:13.5px;color:var(--muted)}
.next .tv{margin-top:9px;display:flex}
.tv b{font-family:var(--ff-ui);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);
  border-radius:2px;padding:2px 6px;color:var(--muted)}

/* the spine */
.feed{position:relative;margin-top:8px}
.feed::before{content:"";position:absolute;left:96px;top:0;bottom:34px;width:1px;background:var(--line);z-index:0}
.row{position:relative;display:grid;grid-template-columns:96px 1fr;z-index:1}
.when-col{text-align:right;padding:16px 26px 0 0;position:relative}
.when-col time{display:block;font-family:var(--ff-ui);font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-variant-numeric:tabular-nums}
.when-col small{display:block;font-size:10.5px;color:var(--muted);opacity:.85;font-variant-numeric:tabular-nums}
.row.unread .when-col time{color:var(--accent-text)}
/* only games sit on the spine; stories hang off it, indented clear of it */
.dot{position:absolute;right:-7px;top:18px;width:13px;height:13px;border-radius:50%;background:var(--accent);border:1.5px solid var(--accent)}
.row.game.pre .dot{background:var(--ice);border-color:var(--muted)}
.body-col{padding:12px 0 12px 26px;min-width:0}

/* story: unread shows in its date; a read headline steps back */
.story{display:block;padding:5px 0 13px;border-bottom:1px solid var(--line-soft)}
.story:hover h3{color:var(--accent-ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
.story h3{font-family:var(--ff-head);font-weight:600;font-size:19.5px;line-height:1.22;margin:0;text-wrap:balance}
.story p{font-family:var(--ff-head);font-size:14.5px;line-height:1.45;color:var(--muted);margin:5px 0 0;max-width:62ch}
.story.read h3{color:var(--muted);font-weight:400}
.story.read p{opacity:.65}

/* game band */
.row.game .body-col{padding-block:9px}
.band{display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:0 14px;
  background:var(--band);border:1px solid var(--line);border-radius:3px;padding:11px 14px}
.row.game.win .band{background:var(--accent-wash);border-color:var(--accent)}
.gno{font-family:var(--ff-ui);font-weight:700;font-size:13.5px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.row.game.win .gno{color:var(--accent-text)}
.matchup{min-width:0}
.matchup .opp{font-family:var(--ff-ui);font-weight:700;font-size:19px;line-height:1.15}
.matchup .opp i{font-style:normal;color:var(--muted);font-weight:500;font-size:13.5px}
.matchup .meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.result{display:flex;align-items:center;gap:12px;justify-self:end}
.sc{font-family:var(--ff-ui);font-weight:700;font-size:24px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.sc s{text-decoration:none;color:var(--muted);font-weight:600;padding:0 1px}
.pill{font-family:var(--ff-ui);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:2px;padding:4px 7px;white-space:nowrap}
.pill.w{background:var(--accent);color:var(--on-accent)}
.pill.l{border:1px solid var(--loss);color:var(--loss)}
.after{text-align:right;min-width:62px}
.after b{display:block;font-family:var(--ff-ui);font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.after small{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

.empty{padding:26px 0 0 122px;color:var(--muted);font-family:var(--ff-head);font-style:italic}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;gap:6px 16px;flex-wrap:wrap}
.linkbtn{appearance:none;background:none;border:0;padding:0;cursor:pointer;font:inherit;color:var(--accent-ink);
  text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
.linkbtn[hidden]{display:none}

@media (max-width:620px){
  .feed::before{display:none}
  .row{grid-template-columns:1fr}
  .when-col{text-align:left;padding:14px 0 0;display:flex;gap:8px;align-items:baseline}
  .when-col small{display:inline}
  .dot{display:none}
  .body-col{padding-top:4px;padding-left:0}
  .empty{padding-left:0}
  .band{grid-template-columns:38px 1fr;gap:4px 10px}
  .result{grid-column:2;justify-self:start;margin-top:7px}
  .after{text-align:left;min-width:0;display:flex;gap:6px;align-items:baseline}
  .story h3{font-size:18px}
}
@keyframes in-right{from{transform:translateX(28px);opacity:.35}to{transform:none;opacity:1}}
@keyframes in-left{from{transform:translateX(-28px);opacity:.35}to{transform:none;opacity:1}}
#body.in-right{animation:in-right .18s ease-out}
#body.in-left{animation:in-left .18s ease-out}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top" id="top" hidden></header>

  <section id="home" hidden>
    <h1 class="home-title">RSS Feeds</h1>
    <nav class="teams" id="teams" aria-label="Teams"></nav>
  </section>

  <div id="body" hidden>
  <div class="standing">
    <div class="rec"><b id="placeNum">&mdash;</b><span class="lbl" id="placeNote">division</span></div>
    <div class="rec"><b id="gapNum">&mdash;</b><span class="lbl" id="gapNote">playoff spot</span></div>
    <div class="rec"><b id="oddsNum">&mdash;</b><span class="lbl" id="oddsNote">playoff odds</span></div>
  </div>

  <section class="next" id="next"></section>
  <div class="feed" id="feed" role="tabpanel"></div>
  </div>

  <footer>
    <button type="button" class="linkbtn" id="allRead" hidden></button>
    <span id="stamp"></span>
    <span id="syncNote"></span>
  </footer>
</div>

<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById('data').textContent);
var TZ = 'America/Detroit';
var MONTH = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function parts(iso){
  var d = new Date(iso);
  var f = new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'numeric',day:'numeric',
    hour:'numeric',minute:'2-digit',weekday:'short',hour12:true});
  var o = {};
  f.formatToParts(d).forEach(function(p){ o[p.type] = p.value; });
  return {t:d.getTime(), wd:o.weekday, mon:MONTH[+o.month-1], day:+o.day,
          time:o.hour+':'+o.minute+' '+String(o.dayPeriod||'').toLowerCase(),
          key:o.year+'-'+String(o.month).padStart(2,'0')+'-'+String(o.day).padStart(2,'0')};
}
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function side(g){ return '<i>'+(g.home ? 'vs' : 'at')+'</i> '; }
function ordinal(n){ var s = ['th','st','nd','rd'], v = n % 100; return n + (s[(v-20)%10] || s[v] || s[0]); }

/* one team: games in order with the running record. Hockey records W-L-OT (an
   overtime or shootout loss is its own column); football adds ties only once
   there is one; baseball and basketball are W-L. */
function prep(feed){
  var hockey = feed.league === 'nhl', soccer = feed.league === 'epl';
  var games = feed.games.slice().sort(function(a,b){
    return (a.startUTC||a.date) < (b.startUTC||b.date) ? -1 : 1; });
  var w=0,l=0,o=0,t=0,n=0;
  games.forEach(function(g){
    g.p = parts(g.startUTC || g.date+'T23:00:00Z');
    g.pre = g.type === 1;
    g.done = g.ds !== null && g.ds !== undefined;
    if(g.done){
      // soccer says who won outright, which also settles a cup tie decided on penalties
      g.won = g.result ? g.result === 'W' : g.ds > g.os;
      g.tie = g.result ? g.result === 'D' : g.ds === g.os;
      // overtime shows on the result: "W OT", "L SO", "L 2OT" (the NHL's REG is plain)
      var extra = g.last && g.last !== 'REG' ? ' '+g.last : '';
      g.pill = g.tie ? (soccer ? 'D' : 'T') : (g.won ? 'W' : 'L') + extra;
      g.cls = g.won ? 'w' : 'l';
    }
    if(g.pre){ g.gno = ''; return; }              // preseason: no number at all
    if(g.type === 3){ g.gno = 'PO'; return; }      // postseason: no game number, no record
    if(g.type === 4){ g.gno = ''; return; }        // a cup game: named in its meta line, not numbered
    n++; g.gno = '['+n+']';
    if(!g.done) return;
    if(g.won) w++; else if(g.tie) t++; else if(hockey && extra) o++; else l++;
    g.rec = hockey ? w+'-'+l+'-'+o : soccer ? w+'-'+t+'-'+l : w+'-'+l+(t ? '-'+t : '');
  });

  var arts = feed.articles.slice().sort(function(a,b){ return a.iso < b.iso ? -1 : 1; });
  arts.forEach(function(a){ a.p = parts(a.iso); });
  return {feed:feed, games:games, arts:arts};
}
var TEAMS = D.feeds.map(prep);

/* read state: opening a story marks it read, on every device.
   The page is static, so the list lives in an Apps Script web app (apps-script/).
   This browser keeps a copy so marks show instantly and survive being offline;
   anything not yet acknowledged waits in `pending` and is retried. */
var SYNC = D.sync || '';
function load(k){ try{ return JSON.parse(localStorage.getItem(k) || '[]'); }catch(e){ return []; } }
function save(k, set){ try{ localStorage.setItem(k, JSON.stringify(Array.from(set))); }catch(e){} }
var read = new Set(load('rssf:read')), pending = new Set(load('rssf:pending'));
var pushing = false;
function note(t){ document.getElementById('syncNote').textContent = t; }
var OFFLINE = 'Read list saved here; will sync when the connection is back';

function markRead(ids){
  var added = ids.filter(function(id){ return id && !read.has(id); });
  added.forEach(function(id){ read.add(id); pending.add(id); });
  if(added.length){ save('rssf:read', read); save('rssf:pending', pending); push(); }
  return added.length;
}
function merge(ids){
  var changed = false;
  ids.forEach(function(id){ if(!read.has(id)){ read.add(id); changed = true; } });
  save('rssf:read', read);
  if(changed) render(); else tabs();
  note('Read list synced '+parts(new Date().toISOString()).time);
}
function push(){
  if(!SYNC || pushing || !pending.size) return;
  pushing = true;
  var sent = Array.from(pending);
  fetch(SYNC, {method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({read:sent})})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j.ok) throw new Error(j.error);
      sent.forEach(function(id){ pending.delete(id); });
      save('rssf:pending', pending);
      pushing = false;
      merge(j.read);
      push();                       // anything opened while that was in flight
    })
    .catch(function(){ pushing = false; note(OFFLINE); });
}
var pulling = false, pulledAt = 0;
function pull(){
  if(!SYNC){ note('Read list kept on this device only'); return; }
  if(pulling || Date.now() - pulledAt < 5000) return;   // several wake-up signals can arrive at once
  pulling = true; pulledAt = Date.now();
  fetch(SYNC + '?op=get', {cache:'no-store'})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j.ok) throw new Error(j.error);
      // a mark this browser has but the server doesn't was lost on the way: resend it
      var srv = new Set(j.read);
      read.forEach(function(id){ if(!srv.has(id)) pending.add(id); });
      save('rssf:pending', pending);
      merge(j.read);
      push();
    })
    .catch(function(){ note(OFFLINE); })
    .then(function(){ pulling = false; });
}

/* which page is showing: the #slug in the address names a team; no slug is the home
   page, which lists every team with its unread count */
var cur = -1, fromHome = false;
function pick(){
  var slug = location.hash.slice(1);
  cur = -1;
  TEAMS.forEach(function(t, i){ if(t.feed.slug === slug) cur = i; });
}
function unreadOf(t){ return t.arts.filter(function(a){ return !read.has(a.id); }).length; }
// the counts: on the home page's list, or in the team page's header and footer link
function tabs(){
  var btn = document.getElementById('allRead');
  if(cur < 0){
    document.getElementById('teams').innerHTML = TEAMS.map(function(t){
      var n = unreadOf(t);
      return '<a class="team-row" data-team="'+esc(t.feed.slug)+'" href="#'+esc(t.feed.slug)+'"><span class="name">'+esc(t.feed.short)+'</span>'+
        (n ? '<span class="count">'+n+' unread</span>' : '<span class="done">All read</span>')+'</a>';
    }).join('');
    btn.hidden = true;
    return;
  }
  var n = unreadOf(TEAMS[cur]);
  document.getElementById('top').innerHTML = '<button type="button" class="home-btn" id="homeBtn">&lsaquo; Home</button>'+
    '<h1 class="team">'+esc(TEAMS[cur].feed.short)+(n ? ' <span>('+n+')</span>' : '')+'</h1>';
  btn.textContent = 'Mark all '+n+' '+TEAMS[cur].feed.short+' stories read';
  btn.hidden = !n;
}
function unreadIds(){
  return TEAMS[cur].arts.filter(function(a){ return !read.has(a.id); }).map(function(a){ return a.id; });
}

/* the browser-tab icon: the app's mark cut down to what reads at 16px -- one dot
   on the spine in the open tab's colour, and three headline bars */
function favicon(){
  var c = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#ce1126';
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">'+
    '<rect width="64" height="64" rx="14" fill="#0d1013"/>'+
    '<rect x="17.5" y="14" width="3" height="38" fill="#3a434d"/>'+
    '<circle cx="19" cy="20" r="8" fill="'+c+'"/><circle cx="19" cy="33" r="4.5" fill="#5b6672"/><circle cx="19" cy="46" r="4.5" fill="#5b6672"/>'+
    '<rect x="31" y="16.5" width="23" height="7" rx="3.5" fill="#dce1e7"/>'+
    '<rect x="31" y="29.5" width="16" height="7" rx="3.5" fill="#dce1e7"/>'+
    '<rect x="31" y="42.5" width="20" height="7" rx="3.5" fill="#dce1e7"/></svg>';
  var link = document.getElementById('favicon');
  link.type = 'image/svg+xml';
  link.href = 'data:image/svg+xml,'+encodeURIComponent(svg);
}

function render(){
  var home = cur < 0;
  document.getElementById('home').hidden = !home;
  document.getElementById('body').hidden = home;
  document.getElementById('top').hidden = home;
  if(home){
    document.documentElement.setAttribute('data-team', 'home');
    document.title = 'RSS Feeds';
    document.getElementById('stamp').textContent = '';
    favicon();
    tabs();
    return;
  }
  var T = TEAMS[cur], games = T.games, arts = T.arts;
  document.documentElement.setAttribute('data-team', T.feed.slug);
  document.title = T.feed.short+' · RSS Feeds';
  favicon();
  tabs();

  // where the team stands: big text, then what it's measured against
  // story-only tabs (Soccer, Power Rankings) have no table and no schedule
  var S = T.feed.standing, $ = function(id){ return document.getElementById(id); };
  document.querySelector('.standing').hidden = !S;
  if(S){
    $('placeNum').textContent = S.place ? ordinal(S.place)+' Place' : '—';
    $('placeNote').textContent = S.division;
    if(S.gap === null){ $('gapNum').textContent = '—'; $('gapNote').textContent = 'playoff spot'; }
    else {
      $('gapNum').textContent = (S.gap % 1 ? S.gap.toFixed(1) : S.gap)+' '+S.unit+(S.gap === 1 ? '' : 's')+(S.inside ? ' Clear' : ' Back');
      $('gapNote').textContent = S.gapNote || (S.inside ? 'of first team out' : 'of playoff spot');
    }
    var o = S.odds;
    if(S.third){                             // a figure the build chose (college basketball's record)
      $('oddsNum').textContent = S.third.big; $('oddsNote').textContent = S.third.note;
    } else if(o === null && S.record){              // a league table has no odds; its record stands in
      $('oddsNum').textContent = S.record; $('oddsNote').textContent = 'W-D-L';
    } else {
      $('oddsNum').textContent = o === null ? '—' : o > 0 && o < 1 ? '<1%' : o > 99 && o < 100 ? '>99%' : Math.round(o)+'%';
      // Hockey-Reference starts a season's odds once every team has played 10 games
      $('oddsNote').textContent = o === null && T.feed.league === 'nhl' ? 'playoff odds · after 10 games' : 'playoff odds';
    }
  }

  var g0 = games.filter(function(g){ return !g.done; })[0];
  document.getElementById('next').innerHTML = !g0 ? '' :
    '<div class="lbl">Up next</div>'+
    '<h2>'+side(g0)+esc((g0.oppPlace+' '+g0.oppName).trim())+'</h2>'+
    '<div class="when num">'+g0.p.wd+', '+g0.p.mon+' '+g0.p.day+' &middot; '+(g0.tbd ? 'Time TBD' : g0.p.time+' ET')+' &middot; '+esc(g0.venue)+'</div>'+
    (g0.tv ? '<div class="tv"><b>'+esc(g0.tv)+'</b></div>' : '');

  // each game, then the stories filed before the next one shown. A story sits under the
  // last finished game before it: the one it follows may still be being played.
  var done = games.filter(function(g){ return g.done; });
  // The timeline starts at the game the oldest story follows: a feed only reaches back
  // about a hundred stories, and baseball's first months would be a long run of empty gaps.
  if(arts.length){
    var from = 0;
    done.forEach(function(g, i){ if(g.p.t <= arts[0].p.t) from = i; });
    done = done.slice(from);
  }
  arts.forEach(function(a){
    a.under = null;
    for(var i=0;i<done.length && done[i].p.t <= a.p.t;i++) a.under = done[i];
  });
  var blocks = [];
  // stories from before the first game simply run on at the bottom, no heading
  arts.filter(function(a){ return !a.under; }).forEach(function(a){ blocks.push({type:'story', a:a}); });
  done.forEach(function(g){
    blocks.push({type:'game', g:g});
    arts.filter(function(a){ return a.under === g; }).forEach(function(a){ blocks.push({type:'story', a:a}); });
  });
  blocks.reverse();                 // newest at the top

  document.getElementById('feed').innerHTML = blocks.map(function(b){
    if(b.type === 'story'){
      var a = b.a, isRead = read.has(a.id);
      return '<div class="row'+(isRead?'':' unread')+'"><div class="when-col"><time datetime="'+esc(a.iso)+'">'+a.p.mon+' '+a.p.day+
        '</time><small>'+esc(a.p.time)+(a.src ? ' &middot; '+esc(a.src) : '')+'</small></div>'+
        '<div class="body-col"><a class="story'+(isRead?' read':'')+'" data-id="'+esc(a.id)+'" href="'+esc(a.link)+'" target="_blank" rel="noopener">'+
        '<h3>'+esc(a.title)+'</h3>'+(a.dek ? '<p>'+esc(a.dek)+'</p>' : '')+'</a></div></div>';
    }
    var g = b.g;
    return '<div class="row game '+(g.won?'win ':'')+(g.pre?'pre ':'')+'"><div class="when-col">'+
      '<time datetime="'+esc(g.date)+'">'+g.p.mon+' '+g.p.day+'</time><small>'+g.p.wd+'</small>'+
      '<span class="dot"></span></div><div class="body-col"><div class="band">'+
      '<div class="gno">'+esc(g.gno)+'</div>'+
      '<div class="matchup"><div class="opp">'+side(g)+esc((g.oppPlace+' '+g.oppName).trim())+'</div>'+
      '<div class="meta">'+(g.pre?'Preseason &middot; ':'')+(g.type === 4 ? esc(g.comp)+' &middot; ' : '')+esc(g.venue)+(g.tv ? ' &middot; '+esc(g.tv) : '')+'</div></div>'+
      '<div class="result"><span class="sc">'+g.ds+' <s>&ndash;</s> '+g.os+'</span>'+
      '<span class="pill '+g.cls+'">'+esc(g.pill)+'</span>'+
      (g.rec ? '<span class="after"><b>'+g.rec+'</b><small>record</small></span>' : '')+
      '</div></div></div></div>';
  }).join('') || '<div class="row"><p class="empty">Nothing filed yet.</p></div>';

  var newest = arts[arts.length-1];
  document.getElementById('stamp').textContent = newest ?
    'Newest story '+newest.p.mon+' '+newest.p.day+', '+newest.p.time+' ET' : 'No stories yet this season';
}

// click, middle-click and the keyboard all open the link; any of them marks it read
function opened(e){
  var link = e.target.closest && e.target.closest('a.story');
  if(!link || !markRead([link.dataset.id])) return;
  link.classList.add('read');
  link.closest('.row').classList.remove('unread');
  tabs();
}
document.getElementById('feed').addEventListener('click', opened);
document.getElementById('feed').addEventListener('auxclick', opened);
document.getElementById('allRead').addEventListener('click', function(){
  var ids = unreadIds();
  if(ids.length && confirm('Mark all '+ids.length+' '+TEAMS[cur].feed.short+' stories as read?')){ markRead(ids); render(); }
});
function go(i, from){
  if(cur < 0 || i < 0 || i >= TEAMS.length || i === cur) return;
  cur = i;
  history.replaceState(null, '', '#'+TEAMS[cur].feed.slug);
  render();
  window.scrollTo(0, 0);
  if(from){                                   // a swipe slides the new team in from that side
    var body = document.getElementById('body');
    body.classList.remove('in-left', 'in-right');
    void body.offsetWidth;
    body.classList.add(from === 'right' ? 'in-right' : 'in-left');
  }
}
// a team on the home page is a plain link to #slug, so the phone's Back button returns
// home; the Home button goes back the same way when that's where the page came from
document.getElementById('teams').addEventListener('click', function(e){
  if(e.target.closest('.team-row')) fromHome = true;
});
document.getElementById('top').addEventListener('click', function(e){
  if(!e.target.closest('#homeBtn')) return;
  if(fromHome){ history.back(); return; }
  history.pushState(null, '', location.pathname + location.search);
  pick(); render(); window.scrollTo(0, 0);
});

// on a team page, swipe left or right for the next or previous team. Only a quick,
// clearly sideways stroke counts, so scrolling the feed never changes team.
var touch = null;
document.addEventListener('touchstart', function(e){
  touch = e.touches.length === 1 && !e.target.closest('#top')
    ? {x:e.touches[0].clientX, y:e.touches[0].clientY, t:Date.now()} : null;
}, {passive:true});
document.addEventListener('touchend', function(e){
  if(!touch) return;
  var dx = e.changedTouches[0].clientX - touch.x, dy = e.changedTouches[0].clientY - touch.y;
  var quick = Date.now() - touch.t < 700;
  touch = null;
  if(quick && Math.abs(dx) > 60 && Math.abs(dx) > 2 * Math.abs(dy))
    go(cur + (dx < 0 ? 1 : -1), dx < 0 ? 'right' : 'left');
}, {passive:true});
window.addEventListener('hashchange', function(){
  pick();
  if(cur < 0) fromHome = false;
  render();
  window.scrollTo(0, 0);
});
// back from another app or tab: pick up whatever was read on the other device
// Phones often resume a page from memory rather than reloading it, and don't all say
// so the same way, so listen for every signal -- and check every two minutes while open.
function wake(){ if(document.visibilityState === 'visible') pull(); }
document.addEventListener('visibilitychange', wake);
window.addEventListener('pageshow', wake);
window.addEventListener('focus', wake);
window.addEventListener('online', function(){ pulledAt = 0; wake(); });
setInterval(wake, 120000);

pick();
render();
pull();
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function(){});
})();
</script>
</body>
</html>
