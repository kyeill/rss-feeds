<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>RSS Feeds</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: a tab per team; under it one dated spine down the page, games as weighted bands on it, and the beat writing in the gaps between them. */
:root{
  --ice:#f1f4f7; --card:#ffffff; --band:#fbfcfd;
  --ink:#15181d; --muted:#616b78; --line:#d9e0e7; --line-soft:#e8edf1;
  --red:#ce1126; --red-ink:#a60d1e; --win-wash:#fdf2f3;
  --loss:#78828f;
  --ff-head:"Newsreader",Georgia,"Times New Roman",serif;
  --ff-ui:"Barlow","Helvetica Neue",Arial,sans-serif;
  --ff-score:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --ice:#0d1013; --card:#15191e; --band:#171c22;
  --ink:#eceff3; --muted:#8e99a6; --line:#262d35; --line-soft:#1e242b;
  --red:#ff3047; --red-ink:#ff5d6e; --win-wash:#221316;
  --loss:#6f7a87; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --ice:#0d1013; --card:#15191e; --band:#171c22;
  --ink:#eceff3; --muted:#8e99a6; --line:#262d35; --line-soft:#1e242b;
  --red:#ff3047; --red-ink:#ff5d6e; --win-wash:#221316;
  --loss:#6f7a87; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--ice);color:var(--ink);font-family:var(--ff-ui);font-size:15px;line-height:1.45;margin:0;padding:0 16px;-webkit-font-smoothing:antialiased}
.wrap{max-width:860px;margin:0 auto;padding-block:0 64px}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:2px}
.lbl{font-family:var(--ff-ui);font-size:10.5px;font-weight:600;letter-spacing:.11em;text-transform:uppercase;color:var(--muted)}
.num{font-variant-numeric:tabular-nums}

/* team tabs */
header.tabs{position:sticky;top:0;z-index:6;background:var(--ice);border-bottom:2px solid var(--ink);
  padding-top:max(14px, env(safe-area-inset-top));display:flex;gap:26px;overflow-x:auto;scrollbar-width:none}
header.tabs::-webkit-scrollbar{display:none}
.tabs button{appearance:none;background:none;border:0;border-bottom:4px solid transparent;margin-bottom:-2px;cursor:pointer;
  font-family:var(--ff-score);font-weight:700;font-size:clamp(26px,6.5vw,38px);line-height:1;text-transform:uppercase;
  color:var(--muted);padding:6px 0 9px;white-space:nowrap}
.tabs button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
.tabs button span{font-variant-numeric:tabular-nums;color:var(--red-ink);font-weight:600}

.standing{display:flex;align-items:flex-end;gap:22px;flex-wrap:wrap;margin-top:18px}
.rec{display:flex;align-items:baseline;gap:8px}
.rec b{font-family:var(--ff-score);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums}
.form{display:flex;gap:3px;align-items:flex-end}
.form i{width:14px;height:22px;border-radius:2px;display:block;border:1px solid transparent}
.form i.w{background:var(--red)}
.form i.l{background:var(--line);border-color:var(--line)}

/* up next */
.next{margin-top:22px;border:1px solid var(--line);border-top:3px solid var(--red);border-radius:3px;background:var(--card);padding:16px 18px}
.next:empty{display:none}
.next h2{font-family:var(--ff-score);text-transform:uppercase;font-weight:700;font-size:26px;line-height:1.05;margin:7px 0 4px}
.next h2 i{font-style:normal;color:var(--muted);font-weight:600;font-size:17px}
.next .when{font-family:var(--ff-ui);font-size:13.5px;color:var(--muted)}
.next .tv{margin-top:9px;display:flex}
.tv b{font-family:var(--ff-ui);font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;border:1px solid var(--line);
  border-radius:2px;padding:2px 6px;color:var(--muted)}

/* the spine */
.feed{position:relative;margin-top:8px}
.feed::before{content:"";position:absolute;left:96px;top:0;bottom:34px;width:1px;background:var(--line);z-index:0}
.row{position:relative;display:grid;grid-template-columns:96px 1fr;z-index:1}
.when-col{text-align:right;padding:16px 26px 0 0;position:relative}
.when-col time{display:block;font-family:var(--ff-score);font-size:15px;font-weight:600;text-transform:uppercase;letter-spacing:.02em;color:var(--muted);font-variant-numeric:tabular-nums}
.when-col small{display:block;font-size:10.5px;color:var(--muted);opacity:.85;font-variant-numeric:tabular-nums}
.row.unread .when-col time{color:var(--red)}
.dot{position:absolute;right:-5px;top:20px;width:9px;height:9px;border-radius:50%;background:var(--ice);border:1.5px solid var(--line)}
.row.game .dot{width:13px;height:13px;right:-7px;top:18px;background:var(--red);border-color:var(--red)}
.row.game.pre .dot{background:var(--ice);border-color:var(--muted)}
.body-col{padding:12px 0;min-width:0}

/* story: unread shows in its date; a read headline steps back */
.story{display:block;padding:5px 0 13px;border-bottom:1px solid var(--line-soft)}
.story:hover h3{color:var(--red-ink);text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:2px}
.rel{display:block;margin-bottom:3px;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.story h3{font-family:var(--ff-head);font-weight:500;font-size:19.5px;line-height:1.26;margin:0;text-wrap:balance}
.story p{font-family:var(--ff-head);font-size:14.5px;line-height:1.45;color:var(--muted);margin:5px 0 0;max-width:62ch}
.story.read h3{color:var(--muted);font-weight:400}
.story.read p{opacity:.65}

/* game band */
.row.game .body-col{padding:9px 0}
.band{display:grid;grid-template-columns:40px 1fr auto;align-items:center;gap:0 14px;
  background:var(--band);border:1px solid var(--line);border-radius:3px;padding:11px 14px}
.row.game.win .band{background:var(--win-wash);border-color:var(--red)}
.gno{font-family:var(--ff-score);font-weight:700;font-size:17px;color:var(--muted);text-align:center;font-variant-numeric:tabular-nums}
.row.game.win .gno{color:var(--red)}
.matchup{min-width:0}
.matchup .opp{font-family:var(--ff-score);font-weight:700;font-size:23px;line-height:1.08;text-transform:uppercase}
.matchup .opp i{font-style:normal;color:var(--muted);font-weight:600;font-size:17px}
.matchup .meta{font-size:11.5px;color:var(--muted);margin-top:2px}
.result{display:flex;align-items:center;gap:12px;justify-self:end}
.sc{font-family:var(--ff-score);font-weight:700;font-size:28px;line-height:1;font-variant-numeric:tabular-nums;white-space:nowrap}
.sc s{text-decoration:none;color:var(--muted);font-weight:600;padding:0 1px}
.pill{font-family:var(--ff-ui);font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;border-radius:2px;padding:4px 7px;white-space:nowrap}
.pill.w{background:var(--red);color:#fff}
.pill.l{border:1px solid var(--loss);color:var(--loss)}
.after{text-align:right;min-width:62px}
.after b{display:block;font-family:var(--ff-score);font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.after small{display:block;font-size:9.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}

/* gaps and chapter rules */
.gap{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:16px 0 10px 122px}
.gap hr{flex:1;height:0;border:0;border-top:1px solid var(--line-soft);min-width:12px}
.chapter{grid-column:1/-1;padding:30px 0 6px 122px;border-top:1px solid var(--line);margin-top:22px}
.chapter h2{font-family:var(--ff-score);text-transform:uppercase;font-weight:700;font-size:22px;margin:10px 0 2px}
.chapter p{font-family:var(--ff-head);font-style:italic;color:var(--muted);margin:0;font-size:14.5px;max-width:58ch}
.empty{padding:26px 0 0 122px;color:var(--muted);font-family:var(--ff-head);font-style:italic}
footer{margin-top:34px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;display:flex;gap:6px 16px;flex-wrap:wrap}

@media (max-width:620px){
  .feed::before{display:none}
  .row{grid-template-columns:1fr}
  .when-col{text-align:left;padding:14px 0 0;display:flex;gap:8px;align-items:baseline}
  .when-col small{display:inline}
  .dot,.row.game .dot{display:none}
  .body-col{padding-top:4px}
  .gap,.chapter,.empty{padding-left:0}
  .band{grid-template-columns:34px 1fr;gap:4px 12px}
  .result{grid-column:2;justify-self:start;margin-top:7px}
  .after{text-align:left;min-width:0;display:flex;gap:6px;align-items:baseline}
  .story h3{font-size:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

</div>

<script>
(function(){
"use strict";
var D = JSON.parse(document.getElementById('data').textContent);
var TZ = 'America/Detroit';
var MONTH = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

function parts(iso){
  var d = new Date(iso);
  var f = new Intl.DateTimeFormat('en-US',{timeZone:TZ,year:'numeric',month:'numeric',day:'numeric',
    hour:'numeric',minute:'2-digit',weekday:'short',hour12:true});
  var o = {};
  f.formatToParts(d).forEach(function(p){ o[p.type] = p.value; });
  return {t:d.getTime(), wd:o.weekday, mon:MONTH[+o.month-1], day:+o.day,
          time:o.hour+':'+o.minute+' '+String(o.dayPeriod||'').toLowerCase(),
          key:o.year+'-'+String(o.month).padStart(2,'0')+'-'+String(o.day).padStart(2,'0')};
}
function dayDiff(a,b){ return Math.round((new Date(b.key) - new Date(a.key))/864e5); }
function esc(s){ return String(s).replace(/[&<>"]/g,function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function side(g){ return '<i>'+(g.home ? 'vs' : 'at')+'</i> '; }

/* one team: games in order with the running record, and each story tied to the game it follows */
function prep(feed){
  var games = feed.games.slice().sort(function(a,b){
    return (a.startUTC||a.date) < (b.startUTC||b.date) ? -1 : 1; });
  var w=0,l=0,o=0,n=0,played=[];
  games.forEach(function(g){
    g.p = parts(g.startUTC || g.date+'T23:00:00Z');
    g.pre = g.type === 1;
    g.done = g.ds !== null && g.ds !== undefined;
    if(!g.done) return;
    g.won = g.ds > g.os;
    g.ot = g.last === 'OT' || g.last === 'SO';
    g.pill = g.won ? ('W' + (g.ot ? ' '+g.last : '')) : (g.ot ? 'L '+g.last : 'L');
    g.cls = g.won ? 'w' : 'l';
    if(g.pre){ g.gno = 'PS'; return; }
    n++; g.gno = 'G'+n;
    if(g.won) w++; else if(g.ot) o++; else l++;
    g.rec = w+'-'+l+'-'+o; g.pts = w*2 + o;
    played.push(g);
  });
  var nreg = n;
  games.forEach(function(g){ if(!g.done && !g.pre){ nreg++; g.gno = 'G'+nreg; } });

  var arts = feed.articles.slice().sort(function(a,b){ return a.iso < b.iso ? -1 : 1; });
  arts.forEach(function(a){
    a.p = parts(a.iso);
    var prev = null;
    for(var i=0;i<games.length && games[i].p.t <= a.p.t;i++) prev = games[i];
    var hrs = prev ? (a.p.t - prev.p.t)/36e5 : null;
    var vs = prev ? (prev.home?'vs ':'at ')+prev.opp : '';
    if(prev && prev.done && hrs <= 26) a.rel = Math.round(hrs)+'h after '+vs+' '+prev.ds+'–'+prev.os;
    else if(prev && !prev.done) a.rel = 'after puck drop '+vs;
    else if(prev){ var dd = dayDiff(prev.p, a.p); a.rel = (dd<=1 ? 'day after ' : dd+' days after ')+vs; }
    else a.rel = 'before the first puck drop';
  });
  return {feed:feed, games:games, played:played, arts:arts};
}
var TEAMS = D.feeds.map(prep);

/* read state: opening a story marks it read, on every device.
   The page is static, so the list lives in an Apps Script web app (apps-script/).
   This browser keeps a copy so marks show instantly and survive being offline;
   anything not yet acknowledged waits in `pending` and is retried. */
var SYNC = D.sync || '';
function load(k){ try{ return JSON.parse(localStorage.getItem(k) || '[]'); }catch(e){ return []; } }
function save(k, set){ try{ localStorage.setItem(k, JSON.stringify(Array.from(set))); }catch(e){} }
var read = new Set(load('rssf:read')), pending = new Set(load('rssf:pending'));
var pushing = false;
function note(t){ document.getElementById('syncNote').textContent = t; }
var OFFLINE = 'Read list saved here; will sync when the connection is back';

function markRead(ids){
  var added = ids.filter(function(id){ return id && !read.has(id); });
  added.forEach(function(id){ read.add(id); pending.add(id); });
  if(added.length){ save('rssf:read', read); save('rssf:pending', pending); push(); }
  return added.length;
}
function merge(ids){
  var changed = false;
  ids.forEach(function(id){ if(!read.has(id)){ read.add(id); changed = true; } });
  save('rssf:read', read);
  if(changed) render(); else tabs();
  note('Read list synced');
}
function push(){
  if(!SYNC || pushing || !pending.size) return;
  pushing = true;
  var sent = Array.from(pending);
  fetch(SYNC, {method:'POST', headers:{'Content-Type':'text/plain'}, body:JSON.stringify({read:sent})})
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j.ok) throw new Error(j.error);
      sent.forEach(function(id){ pending.delete(id); });
      save('rssf:pending', pending);
      pushing = false;
      merge(j.read);
      push();                       // anything opened while that was in flight
    })
    .catch(function(){ pushing = false; note(OFFLINE); });
}
function pull(){
  if(!SYNC){ note('Read list kept on this device only'); return; }
  fetch(SYNC + '?op=get')
    .then(function(r){ return r.json(); })
    .then(function(j){
      if(!j.ok) throw new Error(j.error);
      // a mark this browser has but the server doesn't was lost on the way: resend it
      var srv = new Set(j.read);
      read.forEach(function(id){ if(!srv.has(id)) pending.add(id); });
      save('rssf:pending', pending);
      merge(j.read);
      push();
    })
    .catch(function(){ note(OFFLINE); });
}

/* which team is showing: the #slug in the address, so a tab can be bookmarked */
var cur = 0;
function pick(){
  var slug = location.hash.slice(1);
  TEAMS.forEach(function(t, i){ if(t.feed.slug === slug) cur = i; });
}
function tabs(){
  document.getElementById('tabs').innerHTML = TEAMS.map(function(t, i){
    var n = t.arts.filter(function(a){ return !read.has(a.id); }).length;
    return '<button type="button" role="tab" data-i="'+i+'" aria-selected="'+(i===cur)+'">'+esc(t.feed.short)+
      (n ? ' <span>('+n+')</span>' : '')+'</button>';
  }).join('');
}

function render(){
  var T = TEAMS[cur], games = T.games, played = T.played, arts = T.arts;
  tabs();

  var last = played[played.length-1];
  document.getElementById('recNum').textContent = last ? last.rec : '0-0-0';
  document.getElementById('recNote').textContent = played.length + ' games played';
  document.getElementById('ptsNum').textContent = last ? last.pts : 0;
  document.getElementById('form').innerHTML = played.slice(-8).map(function(g){
    return '<i class="'+g.cls+'" title="'+esc((g.home?'vs ':'at ')+g.opp+' '+g.ds+'-'+g.os+' '+g.pill)+'"></i>';
  }).join('');

  var g0 = games.filter(function(g){ return !g.done; })[0];
  document.getElementById('next').innerHTML = !g0 ? '' :
    '<div class="lbl">Up next</div>'+
    '<h2>'+side(g0)+esc(g0.oppPlace+' '+g0.oppName)+'</h2>'+
    '<div class="when num">'+g0.p.wd+', '+g0.p.mon+' '+g0.p.day+' &middot; '+g0.p.time+' ET &middot; '+esc(g0.venue)+'</div>'+
    (g0.tv ? '<div class="tv"><b>'+esc(g0.tv)+'</b></div>' : '');

  // each game, then the stories filed before the next one shown. A story sits under the
  // last finished game before it: the one it follows may still be being played.
  var done = games.filter(function(g){ return g.done; });
  arts.forEach(function(a){
    a.under = null;
    for(var i=0;i<done.length && done[i].p.t <= a.p.t;i++) a.under = done[i];
  });
  var blocks = [];
  var early = arts.filter(function(a){ return !a.under; });
  if(early.length){
    blocks.push({type:'chapter', h:'Offseason into camp',
      s:'Nothing on the schedule yet — '+early.length+' stories filed before the first puck drop of the season.'});
    early.forEach(function(a){ blocks.push({type:'story', a:a}); });
  }
  done.forEach(function(g, i){
    if(i > 0){
      var prevG = done[i-1];
      var dd = dayDiff(prevG.p, g.p);
      var cnt = arts.filter(function(a){ return a.under === prevG; }).length;
      blocks.push({type:'gap', text:(dd <= 1 ? 'Back-to-back' : dd+' days between games') +
        (cnt ? ' · '+cnt+' stor'+(cnt===1?'y':'ies') : ' · nothing filed')});
    }
    blocks.push({type:'game', g:g});
    arts.filter(function(a){ return a.under === g; }).forEach(function(a){ blocks.push({type:'story', a:a}); });
  });
  blocks.reverse();                 // newest at the top

  document.getElementById('feed').innerHTML = blocks.map(function(b){
    if(b.type === 'chapter')
      return '<div class="row"><div class="chapter"><div class="lbl">Chapter</div><h2>'+esc(b.h)+
        '</h2><p>'+esc(b.s)+'</p></div></div>';
    if(b.type === 'gap')
      return '<div class="row"><div class="gap"><span class="lbl">'+esc(b.text)+'</span><hr></div></div>';
    if(b.type === 'story'){
      var a = b.a, isRead = read.has(a.id);
      return '<div class="row'+(isRead?'':' unread')+'"><div class="when-col"><time datetime="'+esc(a.iso)+'">'+a.p.mon+' '+a.p.day+
        '</time><small>'+esc(a.p.time)+'</small><span class="dot"></span></div>'+
        '<div class="body-col"><a class="story'+(isRead?' read':'')+'" data-id="'+esc(a.id)+'" href="'+esc(a.link)+'" target="_blank" rel="noopener">'+
        '<span class="rel">'+esc(a.rel)+'</span>'+
        '<h3>'+esc(a.title)+'</h3>'+(a.dek ? '<p>'+esc(a.dek)+'</p>' : '')+'</a></div></div>';
    }
    var g = b.g;
    return '<div class="row game '+(g.won?'win ':'')+(g.pre?'pre ':'')+'"><div class="when-col">'+
      '<time datetime="'+esc(g.date)+'">'+g.p.mon+' '+g.p.day+'</time><small>'+g.p.wd+'</small>'+
      '<span class="dot"></span></div><div class="body-col"><div class="band">'+
      '<div class="gno">'+esc(g.gno)+'</div>'+
      '<div class="matchup"><div class="opp">'+side(g)+esc(g.oppPlace+' '+g.oppName)+'</div>'+
      '<div class="meta">'+(g.pre?'Preseason &middot; ':'')+esc(g.venue)+(g.tv ? ' &middot; '+esc(g.tv) : '')+'</div></div>'+
      '<div class="result"><span class="sc">'+g.ds+' <s>&ndash;</s> '+g.os+'</span>'+
      '<span class="pill '+g.cls+'">'+esc(g.pill)+'</span>'+
      (g.rec ? '<span class="after"><b>'+g.rec+'</b><small>record</small></span>' : '')+
      '</div></div></div></div>';
  }).join('') || '<div class="row"><p class="empty">Nothing filed yet.</p></div>';

  var newest = arts[arts.length-1];
  document.getElementById('stamp').textContent = newest ?
    'Newest story '+newest.p.mon+' '+newest.p.day+', '+newest.p.time+' ET' : 'No stories yet this season';
  document.getElementById('credit').textContent = 'Stories: '+T.feed.source+' via siftrss';
}

// click, middle-click and the keyboard all open the link; any of them marks it read
function opened(e){
  var link = e.target.closest && e.target.closest('a.story');
  if(!link || !markRead([link.dataset.id])) return;
  link.classList.add('read');
  link.closest('.row').classList.remove('unread');
  tabs();
}
document.getElementById('feed').addEventListener('click', opened);
document.getElementById('feed').addEventListener('auxclick', opened);
document.getElementById('tabs').addEventListener('click', function(e){
  var b = e.target.closest('button[data-i]');
  if(!b) return;
  cur = +b.dataset.i;
  history.replaceState(null, '', '#'+TEAMS[cur].feed.slug);
  render();
});
window.addEventListener('hashchange', function(){ pick(); render(); });
// back from another app or tab: pick up whatever was read on the other device
document.addEventListener('visibilitychange', function(){ if(document.visibilityState === 'visible') pull(); });

pick();
render();
pull();
})();
</script>
</body>
</html>
